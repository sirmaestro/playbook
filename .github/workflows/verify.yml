name: Verify playbook

# Static checks on the source tree: YAML parses, only known action tags, quoted registry data, every option/task/Executable
# reference resolves, own identity (not ReviOS), no mixed line endings, scripts ASCII and parseable by Windows PowerShell 5.1.
# Runs on every push to main and every pull request, and is called by main.yml before a release is built.
# Locally: python tools/verify_playbook.py --ps51   (needs: pip install pyyaml)
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', '.github/workflows/verify.yml']
  pull_request:
    paths: ['src/**', 'tools/**', '.github/workflows/verify.yml']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify playbook source
    # Windows runner: it has Windows PowerShell 5.1, which is what the playbook scripts run under.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.2

      - name: Verify
        run: python tools/verify_playbook.py --ps51

---
title: Configuration
description: Applies some WinDebloat configurations
privilege: TrustedInstaller
actions:

  - !writeStatus: {status: "Optimizing NTFS"}
  - !run:
    path: "%ProgramFiles%\\WinDebloat Tool"
    exe: "wdtool.exe"
    args: "tweaks performance ntfs-last-access disable"
    wait: true
    runas: currentUserElevated
  - !run:
    path: "%ProgramFiles%\\WinDebloat Tool"
    exe: "wdtool.exe"
    args: "tweaks performance ntfs-8dot3-naming disable"
    wait: true
    runas: currentUserElevated
    

  # Disable Memory Compression
  - !powerShell: 
    command: 'Disable-MMAgent -mc'

  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Services\Pending\7971f918-a847-4430-9279-4a52d1efe18d', value: 'RegisterWithAU', type: REG_DWORD, data: '0'}

  - !cmd:
    command: 'setx DOTNET_CLI_TELEMETRY_OPTOUT 1'
    runas: currentUserElevated
    
  - !cmd:
    command: 'setx POWERSHELL_TELEMETRY_OPTOUT 1'
    runas: currentUserElevated

  - !writeStatus: {status: "Removing logs"}
  - !run:
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -ExecutionPolicy Bypass -File CLEANER.ps1'
    weight: 150

  - !writeStatus: {status: "Finalizing process"}
  - !registryValue: {path: 'HKCU\System\GameConfigStore', value: 'GameDVR_FSEBehaviorMode', type: REG_DWORD, data: '0', weight: 70}

  - !powerShell: {command: 'Get-ScheduledTask -TaskPath "\Microsoft\Office\*" | Disable-ScheduledTask'}

  # Alternative way to group services without breaking services like XboxGipSvc
  - !run:
    path: "%ProgramFiles%\\WinDebloat Tool"
    exe: "wdtool.exe"
    args: "tweaks performance service-grouping set recommended"
    wait: true
    runas: currentUserElevated
    weight: 50

  - !run: {exeDir: true, exe: "FINALIZE.cmd", weight: 200}

  - !run:
    exeDir: true
    exe: "STARTMENU.cmd"
    option: "remove-pinned-items-startmenu"
    weight: 100

  - !run:
    exeDir: true
    exe: "FILEASSOC.cmd"
    option: "remove-appx-photos"
    weight: 150

  # === Themes

  - !powerShell:
    command: '.\\Set-Theme.ps1 -Path (Join-Path $env:SystemRoot "Resources\\Themes\\dark.theme")'
    exeDir: true
    runas: currentUserElevated
    option: "configure-darkmode"


  # Still necessary to set for W10
  ## if dark mode is deselected, then revert to light mode
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '0', option: "configure-darkmode", weight: 70}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', type: REG_DWORD, data: '0', option: "configure-darkmode", weight: 50}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '1', option: "!configure-darkmode", weight: 70}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', type: REG_DWORD, data: '1', option: "!configure-darkmode", weight: 50}


  # === Apps Windows installs AFTER the early removal steps ran (Teams update staged by WU, Copilot Win32 from Edge
  # === Update, StartExperiencesApp from C:\Windows\InboxApps). Remove again now, and repeat after reboot via a
  # === self-deleting scheduled task (POSTCLEAN.ps1 -Register). See docs/references-learnings.md.
  # ------> Without its InboxApps bundle Windows has nothing to re-register at logon (the Deprovisioned key is not enough).
  - !file: {path: '%WinDir%\InboxApps\Microsoft.StartExperiencesApp_8wekyb3d8bbwe.msixbundle'}
  - !file: {path: '%WinDir%\InboxApps\Microsoft.StartExperiencesApp_8wekyb3d8bbwe.xml'}
  # ------> Widgets platform runtime: the only other bundle in InboxApps on 26100 (appx.yml already removes the package).
  - !file: {path: '%WinDir%\InboxApps\Microsoft.WidgetsPlatformRuntime_8wekyb3d8bbwe.msixbundle'}
  - !file: {path: '%WinDir%\InboxApps\Microsoft.WidgetsPlatformRuntime_8wekyb3d8bbwe.xml'}
  - !writeStatus: {status: "Removing apps Windows reinstalls"}
  # ------> Remove-AppxPackage -AllUsers is refused for the staged MSTeams ("Access is denied", DeStage 0x80070005; seen
  # ------> under TI in hv18 and as the elevated user in hv19). POSTCLEAN.ps1 then falls back to wdtool, which removes it.
  # ------> Runs as the elevated user, same pattern as EDGE.ps1 in app-win32.yml.
  - !powerShell:
    command: '.\POSTCLEAN.ps1 -Target StartExperiences -Register'
    exeDir: true
    runas: currentUserElevated
    wait: true
    weight: 40
  - !powerShell:
    command: '.\POSTCLEAN.ps1 -Target Teams -Register'
    exeDir: true
    runas: currentUserElevated
    wait: true
    option: "remove-teams"
    weight: 40
  - !powerShell:
    command: '.\POSTCLEAN.ps1 -Target Copilot -Register'
    exeDir: true
    runas: currentUserElevated
    wait: true
    option: "remove-winsxs-ai"
    weight: 60
  # ------> UCPD denies the HKLM Windows Feeds / Dsh policy writes during the apply on 26300.9711 (it stops only after a
  # ------> restart); the task writes them again after the first reboot. taskbar.yml marks the early writes errorAction: Ignore.
  - !powerShell:
    command: '.\POSTCLEAN.ps1 -Target FeedsPolicy -Register'
    exeDir: true
    runas: currentUserElevated
    wait: true
    weight: 5

  # === New accounts: copy the HKCU tweaks above into the Default profile hive (HKU\.DEFAULT is the SYSTEM profile, not the
  # === template). Reads the YAML in this playbook and copies only the values this user's HKCU actually holds.
  - !writeStatus: {status: "Applying settings to the default user profile"}
  - !powerShell:
    command: '.\DEFAULTUSER.ps1'
    exeDir: true
    runas: currentUserElevated
    wait: true
    weight: 10

  # Necessary to refresh start menu entries etc.
  - !appx: {operation: clearCache, name: '*Client.CBS*'}
  - !appx: {operation: clearCache, name: '*StartMenuExperienceHost*', option: "remove-pinned-items-startmenu"}
  - !appx: {operation: clearCache, name: '*Windows.Search*'}
  - !appx: {operation: clearCache, name: '*TCUI*'}

  # Force update group policy
  - !run: 
    exe: "gpupdate.exe"

  # Apply micro patches via WinDebloat Tool in order to avoid new playbook releases for minor changes
  - !run:
    path: "%ProgramFiles%\\WinDebloat Tool"
    exe: "wdtool.exe"
    args: "tweaks patches"
    wait: true
    runas: currentUserElevated
    
  - !powerShell:
    command: |
      $explorerProcess = Get-Process -Name explorer -ErrorAction SilentlyContinue
      if ($explorerProcess) {
        Stop-Process -Name explorer -Force
      }
      Start-Process explorer
    runas: currentUserElevated

  # ------> wdtool mounts the Default profile hive as HKU\DefaultUserHive for its HKCU tweaks and never unloads it. While it is
  # ------> mounted Windows cannot copy C:\Users\Default\NTUSER.DAT, so an account created before the next restart gets a
  # ------> temporary profile. Release it last, after the final wdtool call. Never fails the apply.
  - !powerShell:
    command: |
      for ($i = 0; $i -lt 6; $i++) {
        if (-not (Test-Path 'Registry::HKEY_USERS\DefaultUserHive')) { break }
        [gc]::Collect(); [gc]::WaitForPendingFinalizers()
        & reg.exe unload 'HKU\DefaultUserHive' 2>&1 | Out-Null
        if ($LASTEXITCODE -eq 0) { break }
        Start-Sleep -Seconds 2
      }
      exit 0
    runas: currentUserElevated

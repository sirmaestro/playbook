---
title: Initialization
description: Copies WinDebloat folders/files, and configures some initial settings
privilege: TrustedInstaller
actions:
  
  - !writeStatus: {status: "Initializing"}

  # Prevent annoying notifications during deployment
  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings\Windows.SystemToast.SecurityAndMaintenance'
    value: 'Enabled'
    type: REG_DWORD
    data: '0'

  - !cmd:
    exeDir: true
    command: 'robocopy "Licenses" "%SystemDrive%\Licenses" /E /PURGE /IM /IT /NP'
    ignoreErrors: true
    weight: 30

  # ------> App installer, run by the user after the playbook (Executables would be gone by then).
  # ------> No /PURGE on the root: it keeps the install-apps-*.log transcripts the script writes next to itself.
  - !cmd:
    exeDir: true
    command: 'robocopy "." "%ProgramData%\WinDebloat\Install Apps" INSTALL-APPS.cmd INSTALL-APPS.ps1 assoc.ps1 /IM /IT /NP & robocopy "Apps" "%ProgramData%\WinDebloat\Install Apps\Apps" /E /PURGE /IM /IT /NP & robocopy "SFTA" "%ProgramData%\WinDebloat\Install Apps\SFTA" /E /PURGE /IM /IT /NP'
    ignoreErrors: true
    weight: 10
  - !powerShell:
    weight: 10
    command: >-
      $dir = Join-Path $env:ProgramData 'WinDebloat\Install Apps';
      if (-not (Test-Path -LiteralPath (Join-Path $dir 'INSTALL-APPS.cmd'))) { throw "INSTALL-APPS.cmd was not copied to $dir" };
      $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'Install Apps.lnk'));
      $lnk.TargetPath = Join-Path $dir 'INSTALL-APPS.cmd'; $lnk.WorkingDirectory = $dir;
      $lnk.Description = 'Install app groups with winget (run once after the playbook, while online)';
      $lnk.Save()

  - !cmd:
    exeDir: true
    command: 'copy /y "hosts" "%WINDIR%\System32\drivers\etc\hosts"'
    weight: 20

  # Necessary to clean DNS Cache after modifying hosts
  - !cmd:
    command: 'ipconfig /flushdns'

  - !writeStatus: {status: "Installing VCRedist"}
  - !download: 
    url: 'https://aka.ms/vs/17/release/vc_redist.x64.exe'
    destination: "vc_redist.x64.exe"
    overwrite: true
  - !run:
    exeDir: true
    exe: "vc_redist.x64.exe"
    args: '/quiet /norestart'

  # ------> WinDebloat Tool (debloat-tool/) is built by CI from the same commit and bundled here;
  # ------> nothing is downloaded, so the tool always matches this playbook version.
  - !writeStatus: {status: 'Installing WinDebloat Tool'}
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Halt
    weight: 50
    command: >-
      if (-not (Test-Path -LiteralPath '.\WinDebloatTool-Setup.exe')) { throw 'WinDebloatTool-Setup.exe is missing from Executables.' };
      Start-Process -FilePath '.\WinDebloatTool-Setup.exe' -ArgumentList '/VERYSILENT /TASKS="desktopicon"' -Wait -WindowStyle Hidden

  - !writeStatus: {status: "Optimizing PowerShell"}
  - !run:
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -ExecutionPolicy Bypass -File ngen.ps1'
    weight: 100

  - !writeStatus: {status: "Configuring a power plan"}
  - !run:
    path: "%ProgramFiles%\\WinDebloat Tool"
    exe: "wdtool.exe"
    args: "tweaks performance powerplan enable"
    wait: true
    runas: currentUserElevated
